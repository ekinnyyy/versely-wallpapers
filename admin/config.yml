backend:
  name: github
  repo: ekinnyyy/versely-wallpapers

media_folder: /images
public_folder: /images

collections:
  - name: wallpapers
    label: Wallpapers
    files:
      - name: wallpaper_list
        label: Wallpaper Library
        file: /data/wallpapers.json
        format: json
        fields:
          - name: wallpapers
            label: Wallpaper Sets
            label_singular: Wallpaper Set
            widget: list
            summary: "{{fields.title}}"
            add_to_top: true
            collapsed: auto
            fields:
              - name: title
                label: Title
                widget: string

              - name: category
                label: Category
                widget: string
                required: false

              - name: images
                label: Wallpaper Versions
                label_singular: Wallpaper Version
                widget: list
                required: false
                min: 1
                max: 5
                field:
                  name: image
                  label: Image
                  widget: image

              - name: image
                label: Legacy Single Image
                widget: image
                required: false

              - name: credit_name
                label: Credit Name
                widget: string
                required: false

              - name: credit_url
                label: Credit Link
                widget: string
                required: false
