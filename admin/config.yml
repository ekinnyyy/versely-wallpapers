backend:
  name: github
  repo: ekinnyyy/versely-wallpapers

media_folder: /images
public_folder: /images

collections:
  - name: wallpapers
    label: Wallpapers
    files:
      - name: wallpaper_list
        label: Wallpaper Library
        file: /data/wallpapers.json
        format: json
        fields:
          - name: wallpapers
            label: Wallpapers
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: category, label: Category, widget: string, required: false }
              - { name: image, label: Wallpaper Image, widget: image }
              - { name: credit_name, label: Credit Name, widget: string, required: false }
              - { name: credit_url, label: Credit Link, widget: string, required: false }
