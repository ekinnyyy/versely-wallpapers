backend:
  name: github
  repo: ekinnyyy/versely-wallpapers

media_folder: /images
public_folder: /images

collections:
  - name: wallpapers
    label: Wallpapers
    files:
      - name: wallpaper_list
        label: Wallpaper Library
        file: /data/wallpapers.json
        format: json
        fields:
          - name: wallpapers
            label: Wallpaper Sets
            widget: list
            summary: "{{fields.title}}"
            add_to_top: true
            collapsed: auto
            fields:
              - name: title
                label: Title
                widget: string

              - name: category
                label: Category
                widget: string
                required: false

              - name: image_1
                label: Wallpaper 1
                widget: image

              - name: image_2
                label: Wallpaper 2
                widget: image
                required: false

              - name: image_3
                label: Wallpaper 3
                widget: image
                required: false

              - name: image_4
                label: Wallpaper 4
                widget: image
                required: false

              - name: image_5
                label: Wallpaper 5
                widget: image
                required: false

              - name: credit_name
                label: Credit Name
                widget: string
                required: false

              - name: credit_url
                label: Credit Link
                widget: string
                required: false
